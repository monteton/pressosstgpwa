<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="access-control.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a4bd1" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <title>Меню для плоского живота</title>
  <style>
    /* Меню для плоского живота — стили только этой страницы (тема из app.css) */
    .view { animation: view-in .28s ease; }
    @keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .b-hero { position: relative; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 14px; }
    .b-hero img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .b-hero-text {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 56px 18px 18px;
      background: linear-gradient(to top, rgba(20, 60, 40, .9) 0%, rgba(20, 60, 40, .45) 60%, transparent 100%);
      color: #fff;
    }
    .b-hero h2 { margin: 0 0 2px; font-size: 28px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
    .b-hero p { margin: 0; font-weight: 600; opacity: .9; }

    .b-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .b-stat { padding: 12px 6px; border-radius: var(--radius-sm); background: var(--card); box-shadow: var(--shadow); text-align: center; }
    .b-stat b { display: block; font-size: 20px; font-weight: 800; line-height: 1.1; color: var(--green-deep); }
    .b-stat:nth-child(2) b { color: var(--violet-deep); }
    .b-stat span { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; }

    .dessert-note {
      margin: 0 0 14px; padding: 12px 14px;
      border-radius: var(--radius-sm); background: var(--violet-soft);
      color: var(--violet-deep); font-size: 13px; font-weight: 800; line-height: 1.4;
    }

    /* Карточки вариантов меню */
    .m-card {
      display: flex; align-items: center; gap: 14px;
      padding: 12px; margin-bottom: 12px;
      border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow);
      transition: transform .15s ease;
    }
    .m-card:active { transform: scale(.99); }
    .m-thumb { width: 76px; height: 76px; flex: none; border-radius: 16px; object-fit: cover; }
    .m-text { flex: 1; min-width: 0; }
    .m-text h3 { margin: 0; font-size: 17px; font-weight: 800; }
    .m-text p { margin: 2px 0 6px; font-size: 13px; line-height: 1.35; color: var(--muted); font-weight: 600;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .kcal { display: inline-block; padding: 4px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green-deep); font-size: 12px; font-weight: 800; }

    /* Итого за день */
    .total-title { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .macro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 16px; }
    .macro div { padding: 12px 4px 10px; border-radius: var(--radius-sm); text-align: center; }
    .macro b { display: block; font-size: 17px; font-weight: 800; line-height: 1.1; }
    .macro span { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: var(--muted); }
    .macro .m-k { background: var(--grad-brand); color: #fff; }
    .macro .m-k span { color: rgba(255, 255, 255, .85); }
    .macro .m-p { background: var(--violet-soft); color: var(--violet-deep); }
    .macro .m-f { background: #fdf0dc; color: #9a5b0b; }
    .macro .m-c { background: var(--green-soft); color: var(--green-deep); }

    /* Блюдо */
    .dish { margin-bottom: 14px; border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
    .dish-photo { position: relative; }
    .dish-photo img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .meal-tag {
      display: inline-block; padding: 5px 11px; border-radius: 999px;
      font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      background: var(--violet-soft); color: var(--violet-deep);
    }
    .dish-photo .meal-tag { position: absolute; left: 12px; top: 12px; background: rgba(255, 255, 255, .92); }
    .dish-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; text-align: left; }
    .dish-head .t { flex: 1; min-width: 0; }
    .dish-head .meal-tag { margin-bottom: 6px; }
    .dish-head b { display: block; font-size: 18px; font-weight: 800; line-height: 1.25; }
    .chev { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--bg); color: var(--muted); transition: transform .2s ease; }
    .chev svg { width: 16px; height: 16px; transform: rotate(90deg); }
    .dish.open .chev { transform: rotate(180deg); }
    .dish-body { display: none; padding: 0 16px 16px; }
    .dish.open .dish-body { display: block; }

    .dish-body h4 { margin: 14px 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .dish-body h4:first-child { margin-top: 0; }
    .ing-note { margin: 0 0 6px; font-weight: 700; font-size: 14px; }
    .ing-list { list-style: none; display: grid; gap: 6px; margin: 0; padding: 0; }
    .ing-list li { position: relative; padding: 9px 12px 9px 30px; border-radius: 12px; background: var(--bg); font-size: 15px; font-weight: 600; line-height: 1.35; }
    .ing-list li::before { content: ''; position: absolute; left: 13px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .prep-text p { margin: 0 0 8px; font-size: 15px; line-height: 1.55; }
    .prep-text p:last-child { margin-bottom: 0; }

    .kbju { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; border-radius: 12px; overflow: hidden; }
    .kbju th { padding: 8px 6px; background: var(--violet-soft); color: var(--violet-deep); font-weight: 800; text-align: center; font-size: 11px; letter-spacing: .02em; }
    .kbju th:first-child, .kbju td:first-child { text-align: left; padding-left: 10px; }
    .kbju td { padding: 9px 6px; background: var(--bg); text-align: center; font-weight: 700; border-top: 2px solid var(--card); }
    .kbju td:last-child { color: var(--green-deep); font-weight: 800; }
    .kbju td:first-child { font-weight: 600; }

    .pdf-link { margin-top: 18px; }
    @media (max-width: 380px) { .macro b { font-size: 15px; } .kbju { font-size: 12px; } }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="menu-belly-data.js"></script>
  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const app = document.getElementById('app');
    const DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>';

    function topbar(title, back) {
      return `<header class="topbar">
        <a class="icon-btn" href="${back}" aria-label="Назад">${ICONS.back}</a>
        <h1>${title}</h1>
      </header>`;
    }

    // ---------- Список вариантов меню ----------
    function viewHome() {
      const cards = BELLY_MENUS.map((m, i) => {
        const first = m.meals.find(x => x.photo);
        return `<a class="m-card" href="#/m${i + 1}">
          <img class="m-thumb" src="${first.photo}" alt="">
          <div class="m-text">
            <h3>${m.days}</h3>
            <p>${m.meals.map(x => esc(x.name)).join(' · ')}</p>
            <span class="kcal">${m.total[3]} ккал</span>
          </div>
          <div class="arrow ${i % 2 ? 'arrow-violet' : 'arrow-green'}">${ICONS.arrow}</div>
        </a>`;
      }).join('');

      return topbar('Питание', 'menu.html') + `
        <div class="b-hero">
          <img src="${BELLY_COVER}" alt="">
          <div class="b-hero-text">
            <h2>Меню для<br>плоского живота</h2>
          </div>
        </div>

        <div class="b-stats">
          <div class="b-stat"><b>5</b><span>вариантов меню</span></div>
          <div class="b-stat"><b>10</b><span>дней</span></div>
          <div class="b-stat"><b>${BELLY_MENUS.reduce((n, m) => n + m.meals.length, 0)}</b><span>блюд с КБЖУ</span></div>
        </div>

        <p class="section-title">Меню по дням</p>
        ${cards}

        <a class="btn btn-ghost pdf-link" href="menu-ploskiy-zhivot.pdf" download>${DOWN} Скачать PDF-версию меню</a>`;
    }

    // ---------- Вариант меню ----------
    function kbjuTable(rows) {
      return `<table class="kbju">
        <thead><tr><th>Наименование</th><th>Белки</th><th>Жиры</th><th>Углев.</th><th>Ккал</th></tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
    }

    function dishCard(d) {
      const list = items => `<ul class="ing-list">${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
      let body = '';
      if (d.ingredients) {
        body += `<h4>Ингредиенты</h4>`;
        if (d.ingredientsNote) body += `<p class="ing-note">${esc(d.ingredientsNote)}</p>`;
        body += list(d.ingredients);
        if (d.ingredients2) body += `<p class="ing-note" style="margin-top:10px">${esc(d.ingredients2Title)}</p>` + list(d.ingredients2);
      }
      if (d.prep) body += `<h4>Приготовление</h4><div class="prep-text">${d.prep.map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
      if (d.dessertNote) body += `<p class="dessert-note" style="margin:14px 0 0">${esc(BELLY_DESSERT_NOTE)}</p>`;
      body += `<h4>КБЖУ</h4>` + kbjuTable(d.kbju);

      return `<div class="dish">
        ${d.photo ? `<div class="dish-photo"><img src="${d.photo}" alt="${esc(d.name)}" loading="lazy"><span class="meal-tag">${d.type}</span></div>` : ''}
        <button class="dish-head" aria-expanded="false">
          <div class="t">${d.photo ? '' : `<span class="meal-tag">${d.type}</span>`}<b>${esc(d.name)}</b></div>
          <div class="chev">${ICONS.arrow}</div>
        </button>
        <div class="dish-body">${body}</div>
      </div>`;
    }

    function viewMenu(i) {
      const m = BELLY_MENUS[i];
      const [p, f, c, k] = m.total;
      const prev = i > 0 ? `#/m${i}` : '';
      const next = i < BELLY_MENUS.length - 1 ? `#/m${i + 2}` : '';
      return topbar(m.days, '#/') + `
        <p class="total-title">Итого за день ${i + 1}</p>
        <div class="macro">
          <div class="m-k"><b>${k}</b><span>ккал</span></div>
          <div class="m-p"><b>${p}</b><span>белки</span></div>
          <div class="m-f"><b>${f}</b><span>жиры</span></div>
          <div class="m-c"><b>${c}</b><span>углеводы</span></div>
        </div>
        ${m.meals.map(dishCard).join('')}
        <div class="pager">
          <a class="btn btn-ghost" href="${prev}" ${prev ? '' : 'aria-disabled="true"'}>← Назад</a>
          <a class="btn btn-ghost" href="${next}" ${next ? '' : 'aria-disabled="true"'}>Далее →</a>
        </div>`;
    }

    // ---------- Роутер ----------
    function render() {
      const h = location.hash.replace(/^#\/?/, '');
      const m = h.match(/^m([1-5])$/);
      app.innerHTML = `<div class="view">${m ? viewMenu(+m[1] - 1) : viewHome()}</div>`;
      window.scrollTo(0, 0);
      app.querySelectorAll('.dish-head').forEach(b => b.onclick = () => {
        const open = b.parentElement.classList.toggle('open');
        b.setAttribute('aria-expanded', open);
      });
      // Первое блюдо раскрыто сразу — чтобы было видно, что внутри рецепт
      const first = app.querySelector('.dish');
      if (first) { first.classList.add('open'); first.querySelector('.dish-head').setAttribute('aria-expanded', 'true'); }
    }
    renderTabbar('');
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
