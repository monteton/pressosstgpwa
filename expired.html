<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d1433" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <title>Доступ закрыт</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: radial-gradient(120% 90% at 50% 0%, #3a1f6e 0%, #1d1433 70%);
      color: #fff; text-align: center;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .box { max-width: 380px; }
    .lock {
      width: 88px; height: 88px; margin: 0 auto 22px;
      display: grid; place-items: center; border-radius: 28px;
      background: linear-gradient(120deg, #8f5cf2 0%, #7a4bd1 45%, #3fb07e 100%);
      box-shadow: 0 16px 36px -12px rgba(122, 75, 209, .8);
    }
    .lock svg { width: 40px; height: 40px; }
    h1 { margin: 0 0 12px; font-size: 28px; font-weight: 800; }
    p { margin: 0; font-size: 16px; line-height: 1.55; opacity: .85; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>Доступ окончен</h1>
    <p>Ваши 90 дней доступа к материалам программы подошли к концу.<br><br>Спасибо, что были с нами!</p>
  </div>
</body>
</html>
