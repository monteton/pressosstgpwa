<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="access-control.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a4bd1" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <title>Питание</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="main.html" aria-label="Назад" data-icon="back"></a>
      <h1>Питание</h1>
    </header>

    <button class="welcome-video" id="nutrition-video-btn" style="margin:0 0 16px">
      <div class="play-circle" data-icon="play"></div>
      <div>
        <strong>Видео о питании</strong>
        <span>Посмотрите перед тем, как открыть меню</span>
      </div>
    </button>

    <p class="sub" style="margin:0 2px 14px">Два меню, которые работают вместе с тренировками на осанку и пресс. Рецепты по дням с КБЖУ — прямо в приложении.</p>

    <article class="menu-card">
      <img class="menu-cover" src="images/cover-1300.jpg" alt="Обложка: Меню 1300 калорий">
      <div class="menu-info">
        <span class="menu-tag">5 недель · 35 дней</span>
        <h2>Меню 1300 калорий</h2>
        <p>Рецепты по дням, КБЖУ и список покупок</p>
        <div class="menu-actions">
          <a class="btn btn-green btn-sm menu-open-wide" href="menu-1300.html">Открыть меню</a>
        </div>
      </div>
    </article>

    <article class="menu-card">
      <img class="menu-cover" src="images/cover-belly.jpg" alt="Обложка: Меню для плоского живота">
      <div class="menu-info">
        <span class="menu-tag">10 дней · 18 блюд</span>
        <h2>Меню для плоского живота</h2>
        <p>Рецепты с фото и КБЖУ</p>
        <div class="menu-actions">
          <a class="btn btn-green btn-sm menu-open-wide" href="menu-belly.html">Открыть меню</a>
        </div>
      </div>
    </article>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = ICONS[el.dataset.icon]);
    renderTabbar('');

    const NUTRITION_VIDEO = 'https://file-storage.bothelp.io/myuppy/f5/f5d6/f5d6f18fe0df0187c561b25cfae4b1f9/IMG_2753.mov';
    document.getElementById('nutrition-video-btn').onclick = () => openVideo(NUTRITION_VIDEO, 'Видео о питании');

  </script>
</body>
</html>
