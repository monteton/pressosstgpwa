<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="access-control.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a4bd1" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>Меню 1300 калорий</title>
  <style>
    /* Меню 1300 — стили только этой страницы (тема из app.css) */
    .view { animation: view-in .28s ease; }
    @keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .n-hero { position: relative; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 14px; }
    .n-hero img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: 50% 35%; }
    .n-hero .n-hero-text {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 56px 18px 18px;
      background: linear-gradient(to top, rgba(36, 20, 70, .9) 0%, rgba(58, 31, 110, .45) 60%, transparent 100%);
      color: #fff;
    }
    .n-hero .eyebrow { background: rgba(222, 243, 232, .92); }
    .n-hero h2 { margin: 10px 0 2px; font-size: 28px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
    .n-hero p { margin: 0; font-weight: 600; opacity: .9; }

    .n-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .n-stat { padding: 12px 6px; border-radius: var(--radius-sm); background: var(--card); box-shadow: var(--shadow); text-align: center; }
    .n-stat b { display: block; font-size: 20px; font-weight: 800; line-height: 1.1; color: var(--violet-deep); }
    .n-stat:nth-child(even) b { color: var(--green-deep); }
    .n-stat span { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; }

    .row2 .chip-btn { width: 100%; }

    /* Карточки недель */
    .week-card {
      position: relative; display: flex; align-items: center; gap: 14px;
      padding: 16px; margin-bottom: 12px;
      border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow);
      transition: transform .15s ease;
    }
    .week-card:active { transform: scale(.99); }
    .week-num {
      width: 52px; height: 52px; flex: none;
      display: grid; place-items: center;
      border-radius: 16px; color: #fff; font-size: 22px; font-weight: 800;
      background: var(--grad-violet);
    }
    .week-card:nth-of-type(even) .week-num { background: var(--grad-green); }
    .week-card.vip .week-num { background: var(--grad-brand); }
    .week-text { flex: 1; min-width: 0; }
    .week-text h3 { margin: 0; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .week-text p { margin: 2px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vip-tag { padding: 3px 8px; border-radius: 999px; background: var(--grad-brand); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .06em; }

    /* Список продуктов — большая кнопка */
    .shop-btn { margin: 0 0 18px; }
    .shop-btn .play-circle svg { margin-left: 0; }

    /* Карточки дней */
    .day-card {
      position: relative; display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; margin-bottom: 10px;
      border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow);
      transition: transform .15s ease;
    }
    .day-card:active { transform: scale(.99); }
    .day-short {
      width: 46px; height: 46px; flex: none;
      display: grid; place-items: center;
      border-radius: 14px; background: var(--violet-soft); color: var(--violet-deep);
      font-weight: 800; font-size: 15px;
    }
    .day-card.done .day-short { background: var(--grad-green); color: #fff; }
    .day-card.done .day-short svg { width: 22px; height: 22px; }
    .day-text { flex: 1; min-width: 0; }
    .day-text h3 { margin: 0; font-size: 16px; font-weight: 800; }
    .day-text p { margin: 2px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); font-weight: 600;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .kcal { flex: none; padding: 5px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green-deep); font-size: 12px; font-weight: 800; }

    /* День: КБЖУ */
    .macro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 14px; }
    .macro div { padding: 12px 4px 10px; border-radius: var(--radius-sm); text-align: center; }
    .macro b { display: block; font-size: 18px; font-weight: 800; line-height: 1.1; }
    .macro span { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: var(--muted); }
    .macro .m-k { background: var(--grad-brand); color: #fff; }
    .macro .m-k span { color: rgba(255, 255, 255, .85); }
    .macro .m-p { background: var(--violet-soft); color: var(--violet-deep); }
    .macro .m-f { background: #fdf0dc; color: #9a5b0b; }
    .macro .m-c { background: var(--green-soft); color: var(--green-deep); }

    /* День: приёмы пищи */
    .meals { position: relative; display: grid; gap: 10px; margin-bottom: 14px; }
    .meal { border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
    .meal-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; text-align: left; }
    .meal-ico { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px; font-size: 20px; }
    .meal-head .t { flex: 1; min-width: 0; }
    .meal-head small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .meal-head b { display: block; font-size: 16px; font-weight: 800; line-height: 1.25; }
    .chev { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--bg); color: var(--muted); transition: transform .2s ease; }
    .chev svg { width: 16px; height: 16px; transform: rotate(90deg); }
    .meal.open .chev { transform: rotate(180deg); }
    .meal-body { display: none; padding: 0 16px 16px; }
    .meal.open .meal-body { display: block; }
    .recipe { margin: 0; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55; }
    .recipe + .recipe { margin-top: 8px; }
    .recipe em { display: block; font-style: normal; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--violet-deep); margin-bottom: 4px; }

    .prep { padding: 14px 16px; border-radius: var(--radius); background: var(--violet-soft); }
    .prep-title { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--violet-deep); }
    .prep-title svg { width: 18px; height: 18px; }
    .prep p { margin: 0; font-size: 15px; line-height: 1.55; }

    /* Продукты дня */
    .prod-group + .prod-group { margin-top: 14px; }
    .prod-group h4 { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips span { padding: 7px 11px; border-radius: 999px; background: var(--bg); font-size: 14px; font-weight: 600; line-height: 1.25; }

    .day-actions { display: grid; gap: 10px; margin-top: 4px; }

    /* Список покупок */
    .shop-cat h3 { margin: 0 0 8px; font-size: 16px; font-weight: 800; }
    .check-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .check-list label {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 12px; border-radius: var(--radius-sm); background: var(--bg);
      font-weight: 600; font-size: 15px; cursor: pointer;
    }
    .check-list input { position: absolute; opacity: 0; pointer-events: none; }
    .box { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border-radius: 8px; border: 2px solid rgba(36, 27, 53, .18); background: #fff; color: #fff; transition: background .15s ease, border-color .15s ease; }
    .box svg { width: 15px; height: 15px; opacity: 0; }
    .check-list input:checked + .box { background: var(--green); border-color: var(--green); }
    .check-list input:checked + .box svg { opacity: 1; }
    .check-list input:checked ~ .lbl { color: var(--muted); text-decoration: line-through; }
    .shop-progress { display: flex; align-items: center; gap: 12px; }
    .shop-progress .progress { flex: 1; margin: 0; height: 8px; }
    .shop-progress b { font-size: 14px; font-weight: 800; color: var(--green-deep); }
    .link-btn { display: block; margin: 6px auto 0; padding: 10px; color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: underline; }

    /* Правила и замены */
    .text-card p { margin: 0 0 10px; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .text-card p:last-child { margin-bottom: 0; }
    .text-card p b { color: var(--ink); }
    .warn { padding: 12px 14px; border-radius: var(--radius-sm); background: #fdf0dc; color: #6b4410 !important; font-size: 15px; line-height: 1.5; }
    .warn b { color: #6b4410 !important; }
    .macro-group { margin-bottom: 14px; }
    .macro-group h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 18px; font-weight: 800; }
    .macro-group h3 i { width: 12px; height: 12px; border-radius: 50%; }
    .macro-sub + .macro-sub { margin-top: 12px; }
    .macro-sub h4 { margin: 0 0 6px; font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .swap-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: sw; }
    .swap-list li { counter-increment: sw; position: relative; padding: 11px 12px 11px 46px; border-radius: var(--radius-sm); background: var(--bg); font-size: 15px; line-height: 1.45; }
    .swap-list li::before { content: counter(sw); position: absolute; left: 10px; top: 10px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--grad-violet); color: #fff; font-size: 13px; font-weight: 800; }

    .pdf-link { margin-top: 18px; }
    @media (max-width: 380px) {
      .n-stat b { font-size: 17px; }
      .macro b { font-size: 16px; }
    }
  </style>
</head>

  <script>
    // Меню 1300 калорий: текст перенесён из 1300call.pdf без изменений, разбит по неделям и дням.
    const WEEKS = [
{"days": [{"name": "Понедельник", "kbju": ["1296", "116,81", "50,08", "98,36"], "meals": [["Завтрак", "Кабачковые оладьи"], ["Второй завтрак", "Овощной салат"], ["Обед", "Табуле"], ["Полдник", "Вареное яйцо"], ["Ужин", "Заливное из грудки + огурцы"]], "recipes": [["Завтрак", "Понадобится 1 яйцо, 100 г кабачка, 50 г овсяных хлопьев длинной варки, соль, зелень по вкусу, разрыхлитель по желанию. Кабачок почистить и нарезать кубиками. Сложить все ингредиенты в чашу блендера, взбить. Дать тесту постоять 10 мин. и жарить оладушки на предварительно хорошо раскалённой антипригарной сковороде, на среднем огне с двух сторон."], ["Второй завтрак", "Салат из 100 г огурцов, 100 г помидоров, 100 г сладкого перца, 10 г оливкового масла, лимонный сок по вкусу и желанию."], ["Готовим на 3 дня", "Понадобится 600 г филе куриной грудки, 200 г моркови, лавровый лист, перец горошком, соль. В кастрюлю сложить грудку и морковь, залить холодной водой (примерно литр). После закипания снять пену, посолить, добавить лавровый лист и перец. Варить 30 мин. 500 г бульона сохранить. Морковь сохранить. Вареное куриное филе разделить на 4 равные части: 1\\4 на обед понедельника, 1\\4 на ужин среды, 2\\4 в заливное (ужин понедельника и вторника)."], ["Обед", "Понадобится вареное куриное филе, 40 г булгура (вес сухого продукта), 50 г огурцов, 50 г сладкого перца, 13 г оливкового масла, сок 1\\4 лимона, зелень (мята, петрушка), соль, перец. Булгур отварить. Овощи и куриное филе нарезать мелкими кубиками. Смешать все ингредиенты."], ["Полдник", "1 вареное яйцо."], ["Ужин", "Понадобится куриное филе, вареная морковь, бульон, 15 г желатина, свежая зелень. Куриное филе разобрать на волокна, морковь нарезать колечками. В холодном бульоне развести желатин, нагреть до 60 градусов, перемешать, чтобы желатин полостью растворился. Куриное филе, морковь, зелень выложить в форму, залить бульоном, убрать в холодильник на несколько часов застывать. Разделить на две равные части между понедельником и вторником. + 100 г огурца."]], "products": [["Яйца 2 шт.", "Филе куриной грудки 600 г"], ["Перец сладкий 150 г", "Помидоры 100 г", "Огурцы 250 г", "Морковь 200 г", "Кабачок 100 г", "Свежая зелень, чеснок", "Лимон"], [], ["Хлопья овсяные длинной варки 50 г", "Булгур 40 г", "Масло оливковое 23 г", "Разрыхлитель", "Желатин", "Лавровый лист", "Перец горошком", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Вторник", "kbju": ["1296", "114,4", "50", "102,14"], "meals": [["Завтрак", "Шакшука"], ["Второй завтрак", "Салат «Метла»"], ["Обед", "Гречка по-купечески"], ["Полдник", "Овощной салат"], ["Ужин", "Заливное + 100 г помидоров"]], "recipes": [["Завтрак", "Понадобится 100 г помидоров, 100 г сладкого перца, 50 г лука, 2 яйца. Овощи нарезать, выложить на раскаленную антипригарную сковороду, снизить огонь до среднего, слегка обжарить, посолить, добавить специи. Сделать в овощах углубления и вбить яйца, готовить, пока белок не схватится."], ["Второй завтрак", "Понадобится 100 г сырой свеклы, 100 г моркови, 100 г капусты, лимонный сок, 11 г оливкового масла, лимонный сок по вкусу. Морковь и свеклу натереть, капусту тонко нашинковать, все перемешать и заправить."], ["Обед", "Готовим гречку по-купечески на два дня. Из расчета 450 г куриного филе, 100 г гречневой крупы, 50 г лука, 50 г моркови, 20 г оливкового масла. Включить в мультиварке режим «Выпечка». Нарезать лук кубиками, морковь соломкой, филе кусочками с грецкий орех. Слегка обжарить овощи и мясо. Посолить, поперчить, добавить специи по вкусу, всыпать гречневую крупу, влить воду (примерно 100 мл), переключить на режим «Плов». Все то же самое можно сделать в сотейнике - сначала на высоком огне обжариваем, потом убавляем огонь и доводим до готовности под крышкой. Готовую кашу заправить оливковым маслом. Разделить поровну между вторником и средой."], ["Полдник", "Салат из 100 г огурцов, 100 г помидоров, 12 г оливкового масла, лимонный сок по вкусу и желанию."], ["Ужин", "Заливное (половина порции из меню понедельника) + 100 г помидоров."]], "products": [["Яйца 2 шт.", "Филе куриной грудки 450 г"], ["Свекла 100 г", "Перец сладкий 100 г", "Помидоры 300 г", "Огурцы 100 г", "Лук 100 г", "Морковь 150 г", "Капуста 100 г", "Свежая зелень, чеснок", "Лимон"], [], ["Крупа гречневая 100 г", "Оливковое масло 43 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Среда", "kbju": ["1300", "112,75", "51,91", "97,23"], "meals": [["Завтрак", "Пшенная каша с тыквой"], ["Второй завтрак", "Салат из фасоли с орехами"], ["Обед", "Гречка по-купечески"], ["Полдник", "Вареное яйцо"], ["Ужин", "Салат с грудкой и овощами"]], "recipes": [["Завтрак", "Для пшенной каши взять 30 г пшена, 100 г тыквы. Тыкву нарезать на кусочки, положить в кастрюлю залить холодной водой так, чтобы она была выше тыквы примерно на палец, довести до кипения, проварить примерно 10 минут. Добавить к тыкве пшено, варить пока пшено не впитает почти всю воду. Добавить в кастрюлю еще 100 мл воды, соль, сахзам по вкусу, варить до готовности."], ["Второй завтрак", "Понадобится 100 г красной консервированной фасоли, 40 г лука, 10 г грецких орехов, 10 г оливкового масла, соль, зелень кинзы, специи по вкусу. Лук и зелень мелко порубить, орехи растолочь, смешать все ингредиенты."], ["Обед", "Гречка по-купечески (половина порции из меню вторника)."], ["Полдник", "1 вареное яйцо."], ["Ужин", "Нарезать отварное куриное филе (с понедельника), 100 г огурцов и 50 г помидоров кубиками. Заправить оливковым маслом (13 г) и 1 ст.л. соевого соуса."]], "products": [["Яйцо 1 шт."], ["Помидоры 50 г", "Огурцы 100 г", "Лук 40 г", "Фасоль красная консервированная 100 г", "Тыква 100 г", "Свежая зелень, чеснок"], [], ["Пшено 30 г", "Оливковое масло 23 г", "Орехи грецкие 10 г", "Соевый соус", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Четверг", "kbju": ["1295", "113,14", "49,37", "98,35"], "meals": [["Завтрак", "Овсяная каша с белком"], ["Второй завтрак", "Салат из капусты с помидорами"], ["Обед", "Рыба в томате с бурым рисом"], ["Полдник", "Миндаль"], ["Ужин", "Салат из тунца"]], "recipes": [["Завтрак", "Взбить 2 белка с сахзамом и 10 г какао. Довести до кипения воду (200 мл). Непрерывно помешивая, всыпать в воду овсяные хлопья длинной варки (40 г). Когда каша будет почти готова, добавить взбитый белок. Варить около двух минут, не прекращая мешать, либо взбивать кашу венчиком. Выключить огонь, накрыть кашу крышкой и дать немного постоять."], ["Второй завтрак", "Салат из 100 г капусты, 100 г помидоров, 9 г оливкового масла, соль и чеснок по вкусу и желанию."], ["Готовим на два дня (четверг и пятница)", "Понадобится 400 г филе трески, 200 г помидоров, 15 г оливкового масла, соль, травы по вкусу, зубчик чеснока. Сложить в чашу блендера кусочки помидоров, чеснок, масло, соль, травы, взбить соус. Филе трески выложить в жаропрочную форму, залить томатным соусом, накрыть фольгой. Выпекать в духовке 30 мин. при 180 градусах. Разделить поровну между четвергом и пятницей."], ["Обед", "Рыба в томате + вареный бурый рис (50 г сухого продукта)."], ["Полдник", "20 г сушеного миндаля."], ["Ужин", "Понадобится 100 г консервированной кукурузы, 100 г зеленого салата, 12 г оливкового масла, 130 г тунца, консервированного в воде, лимонный сок. Зеленый салат нарезать, тунец размять вилкой, смешать все ингредиенты."]], "products": [["Яйца 2 шт.", "Филе трески 400 г", "Тунец консервированный в собственном соку 130 г"], ["Помидоры 300 г", "Зеленый салат 100 г", "Консервированная кукуруза 100 г", "Капуста 100 г", "Свежая зелень, чеснок"], [], ["Овсяные хлопья длинной варки 40 г", "Рис 50 г", "Оливковое масло 36 г", "Какао-порошок 10 г", "Миндаль 20 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Пятница", "kbju": ["1292", "116,76", "50,73", "96,99"], "meals": [["Завтрак", "Гратен из цветной капусты"], ["Второй завтрак", "Салат из свеклы с фасолью"], ["Обед", "Паста с тунцом"], ["Полдник", "Овощной салат"], ["Ужин", "Рыба в томате с цветной капустой"]], "recipes": [["Завтрак", "Отварить 200 г цветной капусты. Половину отложить на ужин. Половину разобрать на небольшие кусочки и выложить в жаропрочную форму. 2 яйца взбить с солью и специями, залить капусту, выпекать 10 мин. при 180 градусах."], ["Второй завтрак", "Понадобится 100 г консервированной красной фасоли, 150 г вареной свеклы, 12 г оливкового масла, соль, чеснок, зелень кинзы по вкусу. Свеклу нарезать кубиками, зелень порубить, смешать все ингредиенты."], ["Обед", "Тунец выложить в сковороду из банки вместе с соком (130 г тунца). Добавить цедру лимона и зелень петрушки, прогреть все вместе. Отварить 60 г цельнозерновых макарон al dente (на 1-2 минуты меньше, чем указано на упаковке) Слить с макарон воду, добавить к тунцу и прогреть все вместе 2-3 минуты. Заправить пасту оливковым маслом (12 г)."], ["Полдник", "Салат из 100 г огурцов, 100 г помидоров, 5 г оливкового масла, лимонный сок по вкусу и желанию."], ["Ужин", "Рыба (половина порции из меню четверга) + цветная капуста с завтрака."]], "products": [["Яйца 2 шт.", "Тунец, консервированный в собственном соку 130 г"], ["Помидоры 100 г", "Огурцы 100 г", "Свекла 150 г", "Фасоль красная консервированная 100 г", "Цветная капуста 200 г", "Свежая зелень, чеснок", "Лимон"], [], ["Макароны 60 г", "Оливковое масло 29 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Суббота", "kbju": ["1300", "114,77", "49,41", "101,38"], "meals": [["Завтрак", "Шоколадный брауни"], ["Второй завтрак", "Яблоки + миндаль"], ["Обед", "Котлеты + гречневая крупа"], ["Полдник", "Вареное яйцо"], ["Ужин", "Котлеты с овощным салатом"]], "recipes": [["Завтрак", "Готовим шоколадный брауни на 2 дня, на субботу и воскресенье. Понадобится: 150 г красной вареной фасоли (можно взять консервированную), 150 г банана, 30 г грецких орехов, 20 г какао-порошка. Орехи порубить. Блендером взбить фасоль, банан, какао. Добавить орех. Вылить тесто в силиконовую формочку, выпекать 30 мин. при 180 градусах. Разделить на две равные части."], ["Второй завтрак", "200 г яблок + 10 г миндаля."], ["Полдник", "1 вареное яйцо."], ["Обед и ужин", "Кабачок (100 г) натереть на крупной тёрке, посолить, оставить на полчаса, чтобы вышел сок. 1 яйцо, филе куриной грудки (360 г), 50 г лука перебить блендером. Либо прокрутить филе с луком через мясорубку и смешать с яйцом. Посолить, поперчить, добавить специи и зелень по вкусу. Кабачок отжать и добавить в фарш, тщательно перемешать. Сформировать котлеты и жарить их на а\\п сковороде без жира с двух сторон."], ["Обед", "1\\2 котлет + вареная гречневая крупа (40 г сухого продукта)."], ["Ужин", "1\\2 котлет + салат (100 г огурцов, 100 г помидоров, 17 г масла)."]], "products": [["Яйца 2 шт.", "Филе куриной грудки 360 г"], ["Помидоры 100 г", "Огурцы 100 г", "Лук 50 г", "Фасоль красная консервированная 150 г", "Кабачок 100 г", "Свежая зелень, чеснок", "Банан 150 г", "Яблоко 200 г"], [], ["Крупа гречневая 40 г", "Оливковое масло 17 г", "Какао-порошок 20 г", "Орехи грецкие 30 г", "Миндаль 10 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Воскресенье", "kbju": ["1303", "111,46", "51,08", "99,07"], "meals": [["Завтрак", "Глазунья с шампиньонами"], ["Второй завтрак", "Брауни"], ["Обед", "Рагу с бурым рисом"], ["Полдник", "Овощной салат"], ["Ужин", "Рагу из говядины с баклажанами"]], "recipes": [["Завтрак", "Понадобится 2 яйца, 100 г шампиньонов, 50 г лука. Шампиньоны и лук мелко нарезать, слегка обжарить на раскаленной антипригарной сковороде. Посолить и поперчить. Разбить к грибам яйца, пожарить глазунью или болтунью."], ["Второй завтрак", "Брауни (половина порции из меню субботы)."], ["Полдник", "Салат: 100 г огурцов, 100 г помидоров, соль-специи по вкусу."], ["Обед и ужин", "Для рагу понадобится 380 г говядины, 200 г помидоров, 50 г лука, 200 г баклажанов. Помидоры взбить блендером с солью и итальянскими травами. Нет блендера - можно разрезать помидор пополам и натер рца, 2 ст.л. соевого соуса, 1 зубчик чеснока, 10 г оливкового масла. Приготовить маринад: смешать в миске соевый соус, раздавленный чеснок и масло. Куриное филе нарезать на кусочки размером с грецкий орех, перец квадратами 3*3 см, грибы почистить, положить курицу и овощи в маринад минимум на 30 мин., лучше на ночь. Деревянные шпажки замочить на 10 мин. в холодной воде. Поочередно нанизать на шпажки курицу, перец и грибы. Запекать шашлычки в духовке при 180 градусах 15-20 мин. Разделить между обедом и ужином."], ["Обед", "1\\3 шашлычков + вареный булгур (40 г сухого продукта)."], ["Ужин", "2\\3 шашлычков."]], "products": [["Яйца 2 шт.", "Филе куриной грудки 370 г"], ["Сладкий перец 200 г", "Огурцы 100 г", "Шампиньоны 200 г", "Фасоль красная консервированная 50 г", "Свежая зелень, чеснок", "Груша 100 г", "Яблоко 300 г"], [], ["Булгур 40 г", "Орехи грецкие 30 г", "Оливковое масло 24 г", "Лаваш 50 г", "Соевый соус", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Воскресенье", "kbju": ["1301", "114,56", "49,18", "101,71"], "meals": [["Завтрак", "Яблочный штрудель"], ["Второй завтрак", "Апельсины"], ["Обед", "Спагетти болоньез"], ["Полдник", "Хлебцы + сыр"], ["Ужин", "Фаршированные перцы"]], "recipes": [["Завтрак", "Яблочный штрудель (половина порции из меню субботы)."], ["Второй завтрак", "200 г апельсинов."], ["Полдник", "2 хлебца + 20 г сыра."], ["Обед и ужин", "Для мясного соуса понадобится 380 г фарша из филе куриной грудки (можно просто мелко нарезать грудку ножом), 200 г помидоров, 20 г лука, 18 г оливкового масла. Помидоры взбить блендером с маслом, солью и итальянскими травами. Нет блендера - можно разрезать помидор пополам и натереть на крупной терке так, чтобы кожица осталась в руке. Мелко нарезать лук. На раскаленной антипригарной сковороде быстро обжарить лук и фарш, влить томатный соус, снизить огонь до минимума, накрыть крышкой, тушить 30 мин. Можно приготовить соус в мультиварке. Обжариваем на режиме «Выпечка», потом режим «Тушение» на полчаса. Разделить соус напополам между обедом и ужином."], ["Готовим обед", "10 г полутвердого сыра натереть. 30 г цельнозерновых макарон (можно заменить на Barilla), отварить до состояния аль денте. Смешать соус с макаронами, посыпать сыром."], ["Готовим ужин", "Сладкий перец разрезать вдоль, вынуть семечки (должно остаться 200 г перца). 20 г полутвердого сыра натереть. Положить мясной соус в половинки перца, посыпать тертым сыром, поставить в духовку на 20 мин. Можно готовить в мультиварке 20 мин на режиме «Выпечка»."]], "products": [["Филе куриной грудки 380 г"], ["Сладкий перец 250 г", "Помидоры 200 г", "Лук 20 г", "Свежая зелень, чеснок", "Апельсин 200 г"], ["Сыр полутвердый 50 г"], ["Макароны 30 г", "Оливковое масло 18 г", "Хлебцы гречневые drKorner 2шт.", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}], "shop": {"title": "Список продуктов на вторую неделю", "cats": [["Мясо и птица", ["Филе куриной грудки 1510 г", "Говядина постная 300 г"]], ["Рыба и морепродукты", ["с\\с рыба (нерка, кета, горбуша) 70 г", "Филе кеты 200 г", "Филе трески 550 г"]], ["Молочные продукты", ["Сыр полутвердый 50 г"]], ["Яйца", ["Яйца 15 шт."]], ["Овощи", ["Свекла 300 г", "Сладкий перец 550 г", "Помидоры 950 г", "Огурцы 400 г", "Лук 280 г", "Морковь 150 г", "Зеленый салат 100 г", "Шампиньоны 500 г", "Фасоль красная консервированная 200 г", "Баклажаны 300 г", "Капуста 150 г", "Кабачок 80 г", "Тыква 80 г", "Чеснок", "Зелень (зеленый лук, укроп, петрушка, кинза)"]], ["Фрукты", ["Груша 100 г", "Грейпфрут 450 г", "Яблоко 300 г", "Апельсин 200 г", "Лимон"]], ["Бакалея", ["Овсяные хлопья длинной варки", "Гречневая крупа", "Рис бурый (либо длиннозерный)", "Макароны цельнозерновые (либо просто ТСП)", "Пшено", "Булгур", "Рисовая мука", "Сахарозаменитель", "Разрыхлитель", "Миндаль 40 г", "Орехи грецкие 65 г", "Лаваш 50 г", "Соевый соус", "Оливковое масло", "Уксус столовый", "Хмели-сунели", "Минеральная вода"]]]}},
{"days": [{"name": "Понедельник", "kbju": ["1299", "115,94", "48,53", "100,46"], "meals": [["Завтрак", "Жареная овсянка с орехами"], ["Второй завтрак", "Яйцо + хлебцы"], ["Обед", "Стейк из грудки с булгуром"], ["Полдник", "Овощной салат"], ["Ужин", "Цезарь с курицей"]], "recipes": [["Завтрак", "Понадобится 2 белка, 15 г сушеного миндаля, 50 г овсяных хлопьев длинной варки, сахзам. Орехи порубить, белок взбить с подсластителем. На сухой раскаленной антипригарной сковороде слегка обжарить овсяные хлопья до золотистого цвета, постоянно помешивая. Влить к хлопьям белок, всыпать орехи, готовить, интенсивно перемешивая, пока белок не обжарится."], ["Второй завтрак", "1 яйцо + 2 хлебца."], ["Полдник", "Овощной салат (150 г помидоров, 150 г огурцов, 10 г оливкового масла)."], ["Обед и ужин", "Для стейка филе куриной грудки (340 г сырого продукта) нарезать на стейки, хорошо отбить. Замариновать в уксусе либо лимонном соке и травах (примерно 30 мин.). Обжарить стейки с двух сторон на сухой раскаленной сковороде (идеальна сковорода-гриль). Стейки выложить на лист фольги, посолить, завернуть в фольгу. Дать постоять 10 минут, чтобы соки равномерно распределились. Разделить стейки между обедом и ужином."], ["Обед", "Стейк + вареный булгур (50 г сухого продукта)."], ["Готовим ужин", "Понадобится 14 г оливкового масла, 1 ст.л. винного уксуса, капля горчицы, соль, 10 г тертого сыра, 100 г помидоров, 50 г зеленого салата, жареная куриная грудка. Приготовить соус: смешать масло, уксус, горчицу и соль. Нарезать помидоры, смешать с салатом, заправить соусом. Сверху выложить кусочки курицы, посыпать тертым сыром."]], "products": [["Яйца 3 шт.", "Филе куриной грудки 340 г"], ["Помидоры 250 г", "Огурцы 150 г", "Зеленый салат 50 г", "Свежая зелень, чеснок"], ["Сыр полутвердый 10 г"], ["Овсяные хлопья длиной варки 50 г", "Булгур 50 г", "Оливковое масло 24 г", "Горчица", "Миндаль 15 г", "Хлебцы гречневые drKorner 2шт.", "Винный уксус", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Вторник", "kbju": ["1302", "114,26", "48,2", "101,02"], "meals": [["Завтрак", "Шакшука"], ["Второй завтрак", "Грейпфрут"], ["Обед", "Тефтели с рисом"], ["Полдник", "Салат «Метла»"], ["Ужин", "Тефтели с салатом"]], "recipes": [["Завтрак", "Понадобится 100 г помидоров, 100 г сладкого перца, 30 г лука, 2 яйца. Овощи нарезать, выложить на раскаленную антипригарную сковороду, снизить огонь до среднего, слегка обжарить, посолить, добавить специи. Сделать в овощах углубления и вбить яйца; готовить, пока белок не схватится."], ["Второй завтрак", "100 г грейпфрута."], ["Полдник", "Понадобится 100 г сырой свеклы, 100 г моркови, 100 г капусты, лимонный сок, 10 г оливкового масла, лимонный сок по вкусу. Морковь и свеклу натереть, капусту тонко нашинковать, все перемешать и заправить."], ["Обед и ужин", "Отварить длиннозерный рис (60 г сухого продукта), остудить. 1\\4 риса отложить на среду, остальное использовать во вторник. Смешать 1\\3 часть риса на вторник, фарш из филе куриной грудки (370 г сырого продукта), 1 белок, добавить соль и специи. Сформировать тефтели размером с грецкий орех, положить в мультиварку, включить режим «Выпечка». Если у вас нет мультиварки, обжарить на сухой, а/п сковороде. Лук (50 г) нарезать кубиками, морковь (50 г) натереть на крупной тёрке. Слегка обжарить овощи на сухой сковороде, посолить. Блендером взбить 200 г помидоров, соль, специи, 10 г оливкового масла. Положить овощи в мультиварку к тефтелям, влить томатный соус, переключить на режим «Тушение». Либо переложить овощи в сковороду к тефтелям, добавить томатный соус, уменьшить огонь до минимума, накрыть крышкой. Тушить час."], ["Обед", "Тефтели + оставшийся рис."], ["Ужин", "Тефтели + овощной салат (100 г помидоров, 100 г огурцов, 12 г оливкового масла)."]], "products": [["Яйца 3 шт.", "Филе куриной грудки 370 г"], ["Перец сладкий 100 г", "Помидоры 400 г", "Огурцы 100 г", "Лук 80 г", "Свекла 100 г", "Морковь 150 г", "Капуста 100 г", "Свежая зелень, чеснок", "Лимон {"days": [{"name": "Понедельник", "kbju": ["1298", "115,87", "50,26", "97,7"], "meals": [["Завтрак", "Стручковая фасоль с яйцом"], ["Второй завтрак", "Миндаль"], ["Обед", "Чахохбили с рисом"], ["Полдник", "Овощной салат"], ["Ужин", "Чахохбили с зеленой фасолью"]], "recipes": [["Завтрак", "2 яйца взбить с солью. Отварить 400 г стручковой фасоли. Половину отложить на ужин, половину выложить на раскаленную антипригарную сковороду. Влить к фасоли яйца, готовить, постоянно перемешивая, пока яйцо не схватится."], ["Второй завтрак", "30 г миндаля."], ["Полдник", "150 г огурцов, 150 г помидоров, 18 г оливкового масла."], ["Обед и ужин", "Понадобится 360 г филе куриной грудки, 300 г помидоров, 50 г лука, 1 ст.л. уксуса, соль, чеснок, зелень кинзы. Помидоры ошпарить, снять кожицу, нарезать кубиками. Курицу нарезать кусочками с грецкий орех, лук полукольцами. Слегка обжарить лук и курицу в антипригарном сотейнике без масла, добавить помидоры, влить уксус. Посолить, поперчить, добавить специи и зелень по вкусу. Снизить огонь до минимума, накрыть крышкой, тушить 30 мин."], ["Обед", "1\\2 чахохбили + вареный рис (45 г сухого продукта)."], ["Ужин", "1\\2 чахохбили + стручковая фасоль, оставшаяся с завтрака."]], "products": [["Яйца 2 шт.", "Филе куриной грудки 360 г"], ["Помидоры 450 г", "Огурцы 150 г", "Лук 50 г", "Фасоль стручковая 400 г", "Свежая зелень, чеснок"], [], ["Рис 45 г", "Оливковое масло 18 г", "Миндаль 30 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Вторник", "kbju": ["1297", "116,16", "49,72", "103,49"], "meals": [["Завтрак", "Тыквенные оладьи"], ["Второй завтрак", "Овощной салат"], ["Обед", "Рагу с булгуром"], ["Полдник", "Вареное яйцо"], ["Ужин", "Рагу"]], "recipes": [["Завтрак", "Понадобится 1 яйцо, 100 г пюре из тыквы, 40 г овсяных хлопьев длинной варки, сахзам, разрыхлитель по желанию. Сложить все ингредиенты в чашу блендера, взбить. Дать тесту постоять 10 мин. и жарить оладушки на предварительно хорошо раскалённой а  антипригарной сковороде без масла, добавить немного кипятка, тушить, пока вода не выкипит. Цветную капусту бланшировать в кипящей подсоленной воде 5 минут. Сложить яйцо, печень, овощи, соль и специи в чашу блендера, перебить (или провернуть через мясорубку). Выложить фарш в небольшую форму, завернуть в фольгу и запекать примерно 30 мин. при 180 градусах. На последние 10 мин. можно развернуть фольгу, чтобы запеканка зарумянилась."], ["Готовим обед", "Запеканка + вареная гречневая крупа (45 г сухого продукта)."], ["Готовим ужин", "Запеканка + овощной салат: 100 г капусты, 100 г моркови, 14 г оливкового масла."]], "products": [["Яйца 4 шт.", "Печень куриная 400 г"], ["Лук 50 г", "Морковь 150 г", "Капуста 100 г", "Цветная капуста 100 г", "Свежая зелень, чеснок", "Грейпфрут 200 г"], [], ["Овсяные хлопья длинной варки 40 г", "Крупа гречневая 45 г", "Оливковое масло 14 г", "Какао-порошок 10 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Четверг", "kbju": ["1295", "115,17", "50,68", "105,66"], "meals": [["Завтрак", "Глазунья с шампиньонами"], ["Второй завтрак", "Грейпфрут"], ["Обед", "Рыба под маринадом с гречневой крупой"], ["Полдник", "Салат из фасоли, кукурузы и грибов"], ["Ужин", "Рыба под маринадом с овощным салатом"]], "recipes": [["Завтрак", "Понадобится 2 яйца, 150 г шампиньонов, 30 г лука. Шампиньоны и лук мелко нарезать, слегка обжарить на раскаленной антипригарной сковороде. Посолить и поперчить. Разбить к грибам яйца, пожарить глазунью или болтунью."], ["Второй завтрак", "200 г грейпфрута."], ["Полдник", "Понадобится 100 г консервированной красной фасоли, 100 г консервированной кукурузы, 100 г шампиньонов, 15 г масла, чеснок, соль, зелень по вкусу. Шампиньоны очистить, нарезать ломтиками, слегка обжарить на раскалённой сковороде. Смешать грибы, фасоль, кукурузу, масло, соль, перец, зелень и давленый чеснок."], ["Обед и ужин", "Понадобится 380 г филе трески, 40 г лука, 80 г моркови, 30 г томатной пасты, чеснок, соль по вкусу. Морковь натереть, лук и чеснок мелко порубить. Томатную пасту развести в 50 мл кипятка. Слегка обжарить овощи на раскаленной антипригарной сковороде, посолить, влить томатную пасту, снизить огонь до среднего, тушить 5 мин. Филе трески выложить в жаропрочную форму, сверху тушеные овощи. Запекать в духовке 15-20 мин. при 180 градусах. Разделить рыбу между обедом и ужином."], ["Обед", "Рыба в маринаде + вареная гречневая крупа (40 г сухого продукта)."], ["Ужин", "Рыба в маринаде + салат: 100 г помидоров, 100 г пекинской капусты, чеснок по вкусу, соль и оливковое масло (19 г)."]], "products": [["Яйца 2 шт.", "Филе трески 380 г"], ["Помидоры 100 г", "Лук 70 г", "Морковь 80 г", "Шампиньоны 250 г", "Фасоль красная консервированная 100 г", "Кукуруза консервированная 100 г", "Пекинская капуста 100 г", "Свежая зелень, чеснок", "Грейпфрут 200 г"], [], ["Крупа гречневая 40 г", "Оливковое масло 34 г", "Томатная паста 30 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Пятница", "kbju": ["1296", "116,09", "50,51", "99,74"], "meals": [["Завтрак", "Овсяная каша с орехами"], ["Второй завтрак", "Хлебцы + с\\с семга"], ["Обед", "Котлеты из кеты с булгуром"], ["Полдник", "Вареное яйцо"], ["Ужин", "Котлеты из кеты с овощным салатом"]], "recipes": [["Завтрак", "Понадобится 40 г овсяных хлопьев длинной варки, 10 г сушеного миндаля, сахзам, щепотка соли. Сварить овсяную кашу на воде, добавить в нее рубленые орехи."], ["Второй завтрак", "2 хлебца + 50 г семги с\\с."], ["Полдник", "1 вареное яйцо."], ["Обед и ужин", "Для котлет понадобится 360 г филе кеты, 1 яйцо, 20 г рисовой муки, 2 ст.л. воды, соль, зелень. Филе кеты нарезать на маленькие кусочки, добавить яйцо, муку, воду, приправы, все тщательно перемешать. Выкладывать котлеты ложкой на раскаленную антипригарную сковороду, жарить на среднем огне с двух сторон без масла."], ["Для обеда", "отварить 45г булгура (вес сухого продукта). + 1\\2 котлет."], ["На ужин", "оставшиеся котлеты + салат: 100 г помидоров, 100 г огурцов, соль и оливковое масло (11 г)."]], "products": [["Яйца 2 шт.", "Филе кеты 360 г", "Семга с/с 50 г"], ["Помидоры 100 г", "Огурцы 100 г", "Свежая зелень, чеснок"], [], ["Овсяные хлопья длинной варки 40 г", "Булгур 45 г", "Оливковое масло 11 г", "Мука рисовая 20 г", "Миндаль 10 г", "Хлебцы гречневые drKorner 2шт.", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Суббота", "kbju": ["1295", "115,84", "50,27", "95,04"], "meals": [["Завтрак", "Омлет в лаваше"], ["Второй завтрак", "Яблоки"], ["Обед", "Запеченная куриная грудка с макаронами"], ["Полдник", "Миндаль"], ["Ужин", "Запеченная куриная грудка с овощным салатом"]], "recipes": [["Завтрак", "Понадобится 2 яйца, 100 г помидоров, 30 г лаваша. Помидор нарезать кубиками, яйца взбить, посолить. Смешать яйца, помидор. Лист лаваша выложить на небольшую сковородку, вылить сверху омлет, свернуть лаваш конвертом, придавить крышкой, жарить с двух сторон на среднем огне."], ["Второй завтрак", "200 г яблок."], ["Полдник", "20 г миндаля."], ["Обед и ужин", "Понадобится 360 г куриного филе, 100 г помидоров, 20 г тертого сыра. Помидоры нарезать полукольцами. Филе куриной грудки отбить, выложить на противень, посолить, сверху разложить помидоры, посыпать тертым сыром, запекать в духовке 25-30 мин. при 180 градусах. Разделить между обедом и ужином."], ["Обед", "Грудка + вареные цельнозерновые макароны (50 г сухого продукта)."], ["Ужин", "Грудка + салат (100 г огурцов, 100 г помидоров, заправить 19 г оливкового масла)."]], "products": [["Яйца 2 шт.", "Филе куриной грудки 360 г"], ["Помидоры 300 г", "Огурцы 100 г", "Свежая зелень, чеснок", "Яблоко 200 г"], ["Сыр полутвердый 20 г"], ["Макароны 50 г", "Оливковое масло 19 г", "Лаваш 30 г", "Миндаль 20 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Воскресенье", "kbju": ["1308", "115,04", "44,75", "112,25"], "meals": [["Завтрак", "Яблочные оладьи"], ["Второй завтрак", "Апельсины"], ["Обед", "Мясной рулет + рис"], ["Полдник", "Миндаль"], ["Ужин", "Мясной рулет с овощным салатом"]], "recipes": [["Завтрак", "Понадобится 100 г яблок, 1 яйцо, 30 г рисовой муки, сахзам, корица. Яблоки натереть на крупной терке. Смешать все ингредиенты. Жарить оладушки на предварительно хорошо раскалённой антипригарной сковороде, на среднем огне с двух сторон."], ["Второй завтрак", "200 г апельсинов."], ["Полдник", "25 г миндаля."], ["Обед и ужин", "Понадобится 340 г куриного филе, 30 г лука, 1 белок, 1 яйцо, 25 г овсяных хлопьев длинной варки, 20 г сыра, соль. Взбить блендером лук, белок, овсяные хлопья длинной варки, щепотку соли и куриное филе. Застелить противень фольгой. Выложить на него половину фарша в виде длинного прямоугольника. Выложить на фарш тонкие кусочки полутвердого сыра. На сыр - половинки крутого яйца. Закрыть второй половиной фарша. Сформировать руками рулет типа буханки, плотно завернуть в фольгу и запекать примерно 30 мин. при 180 градусах. На последние 10 мин. можно развернуть фольгу, чтобы рулет зарумянился."], ["Обед", "Половина рулета + вареный рис (30 г сухого продукта)."], ["Ужин", "1\\2 рулета + салат (50 г капусты, 50 г моркови, 50 г свеклы, 10 г масла, соль, зелень, чеснок)."]], "products": [["Яйца 3 шт.", "Филе куриной грудки 340 г"], ["Свекла 50 г", "Лук 30 г", "Морковь 50 г", "Капуста 50 г", "Свежая зелень, чеснок", "Яблоко 100 г", "Апельсины 200 г"], ["Сыр полутвердый 20 г"], ["Овсяные хлопья длинной варки 25 г", "Рис 30 г", "Оливковое масло 10 г", "Мука рисовая 30 г", "Миндаль 25 г", "корица", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}], "shop": {"title": "Список продуктов на четвертую неделю", "cats": [["Мясо и птица", ["Куриное филе 1430 г", "Печень куриная 400 г"]], ["Рыба и морепродукты", ["Филе кеты 360 г", "Филе трески 380 г", "Семга с\\с 50 г"]], ["Молочные продукты", ["Сыр полутвердый 40 г"]], ["Яйца", ["Яйца 17 шт."]], ["Овощи", ["Свекла 50 г", "Перец сладкий 100 г", "Помидоры 1250 г" {"days": [{"name": "Понедельник", "kbju": ["1300", "116,64", "49,31", "100,61"], "meals": [["Завтрак", "Кокосовые овсяноблинчики"], ["Второй завтрак", "Чиа пудинг"], ["Обед", "Стейк из индейки с киноа"], ["Полдник", "Салат с печеной свеклой, рукколой и кедровыми орешками"], ["Ужин", "Салат «Грин энерджи»"]], "recipes": [["Завтрак", "Понадобится 1 яйцо, 60 г кокосового молока, 50 г овсяных хлопьев длинной варки, сахзам, разрыхлитель по желанию. Сложить все ингредиенты в чашу блендера, взбить. Дать тесту постоять 10 мин. и жарить оладушки на предварительно хорошо раскалённой антипригарной сковороде, на среднем огне с двух сторон."], ["Второй завтрак", "Понадобится 30 г семян чиа, 100 г растительного молока. Семена чиа смешать с молоком, добавить немного подсластителя. Убрать в холодильник на 2 часа."], ["Полдник", "Понадобится 150 г вареной свеклы, 50 г рукколы, 10 г кедровых орешков, 8 г оливкового масла, соль, 1 ч.л. бальзамического уксуса, ложка вареной киноа (с обеда). Свеклу нарезать кубиками, смешать все ингредиенты."], ["Обед и ужин", "Для стейка филе грудки индейки (340 г сырого продукта) нарезать на стейки, хорошо отбить. Замариновать в уксусе либо лимонном соке и травах (примерно 30 мин.). Обжарить стейки с двух сторон на сухой раскаленной сковороде (идеальна сковорода-гриль). Стейки выложить на лист фольги, посолить, завернуть в фольгу. Дать постоять 10 минут, чтобы соки равномерно распределились. Разделить стейки между обедом и ужином."], ["Обед", "Стейк + вареная киноа (40 г сухого продукта). 1 ст.л. вареной крупы из этого объема отложить в салат на полдник."], ["Ужин", "Понадобится запеченная грудка с обеда, 50 г зеленого салата, 100 г шампиньонов, 5 г семян кунжута, 1 ст.л. соевого соуса, 1 ст.л. бальзамического уксуса, 7 г оливкового масла. Шампиньоны очистить, нарезать пластинками и слегка обжарить на раскаленной антипригарной сковороде. Грудку нарезать ломтиками. Смешать соевый соус, масло и уксус. Смешать все ингредиенты, полить соусом, посыпать кунжутом."]], "products": [["Яйцо 1 шт.", "Филе индейки 340 г"], ["Свекла 150 г", "Шампиньоны 100 г", "Зеленый салат 50 г", "Руккола 50 г", "Свежая зелень, чеснок", "Лимон"], ["Растительное молоко без сахара (кокосовое, типа ALPRO) 160 г"], ["Хлопья овсяные длинной варки 50 г", "Оливковое масло 15 г", "Разрыхлитель", "Соевый соус", "Бальзамический уксус", "Кунжут 5 г", "Семена чиа 30 г", "Кедровые орешки 10 г", "Киноа 40 г", "Подсластитель (типа фитпарад)", "Сушеные травы, соль и специи по вкусу"]]}, {"name": "Вторник", "kbju": ["1302", "116,49", "50,34", "102,31"], "meals": [["Завтрак", "Овсяная каша с белком"], ["Второй завтрак", "с\\с семга с хлебцами"], ["Обед", "Табуле с креветками"], ["Полдник", "Овощной салат"], ["Ужин", "Салат из креветок с авокадо"]], "recipes": [["Завтрак", "Взбить 2 белка с сахзамом. Довести до кипения кокосовое молоко (200 г). Непрерывно помешивая, всыпать в молоко овсяные хлопья длинной варки (45 г). Когда каша будет почти готова, добавить взбитый белок. Варить около двух минут, не прекращая мешать, либо взбивать кашу венчиком. Выключить огонь, накрыть кашу крышкой и дать немного постоять."], ["Второй завтрак", "80 г с\\с семги + 4 тонких хлебца drKorner."], ["Обед", "Понадобится 200 г очищенных креветок, 40 г булгура (вес сухого продукта), 50 г огурцов, 50 г сладкого перца, 10 г оливкового масла, сок 1\\4 лимона, зелень (мята, петрушка), соль, перец. Булгур отварить. Овощи нарезать мелкими кубиками. Смешать все ингредиенты."], ["Полдник", "100 г огурцов, 100 г помидоров, 100 г сладкого перца."], ["Ужин", "Понадобится 200 г очищенных креветок, 50 г авокадо, 100 г помидоров, 30 г рукколы, 8 г оливкового масла, капля лимонного сока, соль. Помидоры и авокадо нарезать кубиками, смешать все ингредиенты."]], "products": [["Яйца 2 шт.", "Креветки очищенные 400 г", "Семга с/с 80 г"], ["Сладкий перец 150 г", "Помидоры 200 г", "Огурцы 150 г", "Руккола 30 г", "Свежая зелень, чеснок", "Лимон", "Авокадо 50 г"], ["Растительное молоко без сахара (кокосов         if (isPrep(label)) preps.push([label, text]);
        else {
          const meal = RECIPE_TO_MEAL[label] || label;
          (byMeal[meal] = byMeal[meal] || []).push([label, text]);
        }
      });

      const mealCard = ([name, dish]) => {
        const st = MEAL_STYLE[name];
        const recs = (byMeal[name] || []).map(([label, text]) =>

        <div class="card text-card">
          <h2 style="margin-bottom:10px">Как заменять продукты?</h2>
          <p>У нас у всех разные вкусовые предпочтения, поэтому какие-то небольшие замены продуктов неизбежны. Давайте разберем, как заменять продукты правильно. Нам важно смотреть не только на калорийность, но и на БЖУ. Почему? Основным источником энергии в организме являются углеводы. Резервным – жиры. Белки являются в основном строительным материалом для клеток и практически не выступают в роли источника энергии.</p>
          <p>Как происходит расщепление нашего жира? Если мы тратим энергии больше, чем получаем ее из пищи, то есть создаем дефицит, организм компенсирует нехватку из нашего жирового депо.</p>
          <p>Напоминаю: энергия – это преимущественно углеводы. Если вы заменяете белковые продукты на углеводы (например, творог на яблоки), то увеличиваете объем поступившей энергии и уменьшаете расход, таким образом замедляя процесс похудения.</p>
          <p>Обратная замена также противопоказана. В программах БЖУ уже сбалансирован, и заложено высокое количество белка. Если вы будете еще самостоятельно увеличивать его долю в рационе, есть риск перегрузить почки.</p>
          <p class="note-box">Поэтому заменяем продукты только внутри своих групп по основному источнику: <b>белки на белки, жиры на жиры, углеводы на углеводы.</b></p>
        </div>

        <p class="section-title">Таблица продуктов по преобладающим в их составе макронутриентам</p>
        ${macroGroup('Белки', 'var(--violet)', [
          ['Животный белок', ['Мясо', 'Рыба', 'Птица', 'Творог', 'Сыр', 'Яичный белок']],
        ])}
        ${macroGroup('Жиры', '#e0a33b', [
          ['Ненасыщенные', ['Нерафинированные масла (оливковое, подсолнечное, тыквенное, кунжутное, льняное и т.п.)', 'Авокадо', 'Орехи (миндаль, кешью, грецкий, фундук и т.п.)', 'Семена (чиа, лен, подсолнечник, тыква и т.п.)', 'Жирная рыба']],
          ['Насыщенные', ['Сливочное масло', 'Кокосовое масло', 'Пальмовое масло', 'Животный жир (сало)', 'Яичный желток', 'Жирные молочные продукты (сыр, сливки и т.п.)']],
          ['Трансжиры', ['Майонез', 'Рафинированные масла', 'Сливочные промышленные соусы', 'Фабричные конфеты, печенье, и прочие кондитерские изделия', 'Маргарин', 'Фастфуд']],
        ])}
        ${macroGroup('Углеводы', 'var(--green)', [
          ['Простые углеводы', ['Сахар', 'Мед', 'Молоко', 'Фрукты', 'Сухофрукты', 'Мука высшего сорта', 'Крахмал']],
          ['Сложные углеводы', ['Крупы (гречневая, рис, пшено, перловая, киноа и т.п.)', 'Цельнозерновая мука', 'Макароны ТСП', 'Бобовые (нут, горох, чечевица и т.п.)', 'Крахмалистые овощи (картофель, батат, свекла и т.п.)']],
          ['Фиброуглеводы', ['Волокнистые овощи (огурцы, помидоры, капуста, кабачки, перец, сельдерей, брокколи, цветная капуста и т.п.)', 'Зелень', 'Зеленые салаты']],
        ])}

        <div class="card text-card">
          <p class="warn"><b>Важно!</b> Бобовые считаются источником растительного белка, но заменять ими животный белок нельзя, да и содержание белка в них ниже углеводов. Например, в 100 г чечевицы содержится 310 ккал, 51 г углеводов, и 24 г белка.</p>
        </div>

        <div class="card">
          <h2 style="margin-bottom:12px">Список наиболее частых замен продуктов</h2>
          <ol class="swap-list">
            <li>Волокнистые овощи меняем в произвольном порядке в том же объёме (огурцы = помидоры = перец = капуста = сельдерей и т.п.), например, салат 100 г огурцов + 100 г помидоров вы легко можете заменить на 200 г брокколи, и наоборот.</li>
            <li>Цельную крупу можно менять одну на другую. Булгур = пшено = бурый рис = гречневая крупа = перловая крупа и т.п. Исключение составляют кус-кус и белый рис (из-за более высокого ГИ).</li>
            <li>Фрукты заменяем произвольно (яблоко = груша = апельсин и т.п.). Исключение составляют банан, виноград, манго и хурма (их мы также можем менять между собой).</li>
            <li>В рационах я указываю оливковое масло, но вы можете брать любое нерафинированное.</li>
            <li>Орехи также можно брать любые.</li>
            <li>Филе куриной грудки = филе грудки индейки.</li>
            <li>Филе трески = любая белая нежирная рыба (хек, минтай, судак, сибас).</li>
            <li>Семга = форель = атлантический лосось.</li>
            <li>Креветки = кальмары = коктейль из морепродуктов.</li>
            <li>100 г авокадо = 33 г сушеных орехов.</li>
            <li>Ягоды можно брать как свежие, так и замороженные. Заменяем их между собой произвольно (клубника = малина = смородина = черника и т.п.).</li>
            <li>Оливковое масло = любое другое нерафинированное – подсолнечное, кукурузное и т.п.</li>
          </ol>
        </div>

        <div class="card text-card">
          <p class="warn"><b>Важно!</b> Если вы не едите какой-то продукт, а он встречается каждый день, например, творог или яйца, использование программы в целом теряет смысл. На сайте с помощью фильтров можно изначально подобрать программы, по наличию тех или иных продуктов (без молока, без мяса, без рыбы и т.п.).</p>
          <p>Если вы не едите какой-то продукт, а он встречается 1-2 раза за 35 дней, то лучше просто не использовать этот день. Например, в Неделе 4, в среду, встречается куриная печень. Если вы не едите ее, исключите этот день: возьмите любой другой день, где ее нет.</p>
        </div>

        <a class="btn btn-green" href="#/">К рациону по неделям ${ICONS.arrow}</a>`;
    }

    // ---------- Роутер ----------
    function render() {
      const h = location.hash.replace(/^#\/?/, '');
      let m, html;
      if ((m = h.match(/^w([1-5])\/d([1-7])$/))) html = viewDay(+m[1] - 1, +m[2] - 1);
      else if ((m = h.match(/^w([1-5])\/shop$/))) html = viewShop(+m[1] - 1);
      else if ((m = h.match(/^w([1-5])$/))) html = viewWeek(+m[1] - 1);
      else if (h === 'rules') html = viewRules();
      else if (h === 'swaps') html = viewSwaps();
      else html = viewHome();
      app.innerHTML = `<div class="view">${html}</div>`;
      window.scrollTo(0, 0);
      bind(m);
    }

    function bind(m) {
      app.querySelectorAll('.meal-head').forEach(b => b.onclick = () => {
        const open = b.parentElement.classList.toggle('open');
        b.setAttribute('aria-expanded', open);
      });
      // Первый приём пищи раскрыт сразу — чтобы было видно, что внутри рецепт
      const first = app.querySelector('.meal');
      if (first) { first.classList.add('open'); first.querySelector('.meal-head').setAttribute('aria-expanded', 'true'); }

      const doneBtn = document.getElementById('day-done');
      if (doneBtn) doneBtn.onclick = () => { toggleDay(+m[1] - 1, +m[2] - 1); render(); };

      const boxes = app.querySelectorAll('.check-list input');
      if (boxes.length) {
        const update = () => {
          const on = [...boxes].filter(b => b.checked).length;
          document.getElementById('shop-bar').style.width = (on / boxes.length * 100) + '%';
          document.getElementById('shop-count').textContent = `${on}/${boxes.length}`;
        };
        boxes.forEach(b => b.onchange = () => {
          const s = load();
          if (b.checked) s[b.dataset.key] = 1; else delete s[b.dataset.key];
          save(s); update();
        });
        document.getElementById('shop-reset').onclick = () => {
          const s = load();
          boxes.forEach(b => { b.checked = false; delete s[b.dataset.key]; });
          save(s); update();
        };
      }
    }

    renderTabbar('');
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
